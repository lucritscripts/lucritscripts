<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<!-- Content Security Policy.
     The backstop for everything the escaping might miss: with no
     'unsafe-inline' in script-src, an injected <script> or onerror= simply
     does not execute. Inline STYLES are allowed because the 3D choreography
     sets custom properties from JS; style injection cannot run code.
     Note: frame-ancestors is ignored in a meta tag — it needs a real header,
     which GitHub Pages cannot send. -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  base-uri 'self';
  object-src 'none';
  form-action 'self';
  script-src 'self' https://accounts.google.com https://challenges.cloudflare.com;
  style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com;
  font-src 'self' https://fonts.gstatic.com;
  img-src 'self' data: https:;
  connect-src 'self' https://accounts.google.com https://lucrit-assistant.lucritscripts.workers.dev;
  frame-src https://accounts.google.com https://challenges.cloudflare.com;
">
<title>Lucrit Script — the ultimate Roblox script library</title>
<meta name="description" content="Discover, explore, and build with thousands of Roblox scripts. A searchable library of readable, production-grade Luau modules.">

<meta property="og:type" content="website">
<meta property="og:title" content="Lucrit Script">
<meta property="og:description" content="Discover, explore, and build with thousands of Roblox scripts.">
<meta name="theme-color" content="#05060a">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">

<link rel="stylesheet" href="assets/css/app.css">
<link rel="icon" type="image/png" sizes="64x64" href="assets/img/favicon-64.png">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<meta property="og:image" content="assets/img/logo.png">
</head>

<body>

<!-- Persistent 3D world. Purely presentational: every word lives in the DOM. -->
<canvas id="scene" aria-hidden="true"></canvas>
<div id="grain" aria-hidden="true"></div>

<a class="sr-only" href="#ch-search">Skip to the script library</a>

<noscript>
  <div style="position:relative;z-index:20;max-width:720px;margin:120px auto;padding:28px;
              border:1px solid rgba(140,175,225,.28);border-radius:18px;background:rgba(10,15,26,.9)">
    <h1 style="margin:0 0 10px;font:600 1.6rem/1.1 system-ui">Lucrit Script</h1>
    <p style="margin:0;color:#a8b6cd;font:400 1rem/1.6 system-ui">
      This library needs JavaScript to search and display scripts. Enable it, or browse the
      source directly on GitHub.
    </p>
  </div>
</noscript>

<script type="module" src="assets/js/main.js"></script>

</body>
</html>

name = "lucrit-assistant"
main = "src/index.js"
compatibility_date = "2026-08-01"

# Which model answers. Any id from build.nvidia.com works; this one is a good
# default for Luau — strong at code, fast enough to stream comfortably.
[vars]
MODEL = "meta/llama-3.3-70b-instruct"

# NVIDIA_API_KEY and ALLOWED_ORIGINS are secrets, not vars — they are set with
# `wrangler secret put` and never live in this file or in git.

# One visitor: 6 questions per minute. Enough for a real conversation,
# not enough to script against.
[[ratelimits]]
name = "PER_VISITOR"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 6
  period = 60

# The whole site: a ceiling so a bad day cannot empty the credit balance.
[[ratelimits]]
name = "PER_SITE"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 120
  period = 60

[observability]
enabled = true
